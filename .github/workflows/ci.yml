name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest
        working-directory: server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t peek:ci .
      - name: Serve a frame image from the container
        run: |
          docker run -d --name peek -p 8080:8080 peek:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/sleep && break; sleep 1; done
          curl -sf -o frame.png localhost:8080/frame.png
          file frame.png | grep "800 x 480"
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"name":"CI"}' localhost:8080/api/categories
