# Copy this file to secrets.yaml (next to it) and fill in your own values.
# secrets.yaml stays on your computer: Git ignores it.

wifi_ssid: "Your Wi-Fi name"
wifi_password: "Your Wi-Fi password"
# Any password you like; ESPHome asks for it when it updates the frame over Wi-Fi.
ota_password: "choose-a-password"

# Peek's address as the frame sees it: your Mac's IP address on your home network.
peek_frame_url: "http://192.168.1.23:8080/frame.png"
peek_sleep_url: "http://192.168.1.23:8080/api/sleep"
